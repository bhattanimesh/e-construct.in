<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Construct | Professional Engineering Solutions</title>
    <meta name="description" content="E-Construct provides premium engineering and construction solutions. Modern, high-performance web interface." />

    <!-- Preconnect to external origins used by the app -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://e-construct.in" />

    <!-- DNS prefetch for external image hosts -->
    <link rel="dns-prefetch" href="https://ui-avatars.com" />

    <!-- Preload the hero video so it starts playing immediately -->
    <link rel="preload" href="/hero.mp4" as="video" type="video/mp4" />

    <!-- Preload the logo (above the fold) -->
    <link rel="preload" href="/logo.webp" as="image" />

    <!-- Performance hints -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
